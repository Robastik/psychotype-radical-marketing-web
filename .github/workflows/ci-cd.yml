name: CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage || true

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase service account secret
        id: firebase_check
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONSUMER_BEHAVIOR_CARD }}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "Firebase service account secret is not configured; skipping deploy."
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify code quality
        run: npm run lint

      - name: Build production
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}

      # verify_base.html — build-артефакт, а не исходник: он не коммитится
      # (см. functions/.gitignore) и создаётся build-хуком
      # scripts/prepare-og-base.mjs, который вызывается из `npm run build`
      # (package.json -> build:og-base), то есть шагом «Build production» выше.
      #
      # Этот шаг намеренно ПРОВЕРЯЕТ, а не копирует. Если бы он копировал сам,
      # отвязавшийся от npm run build хук остался бы незамеченным: CI каждый
      # раз молча делал бы работу за него, и дефект всплыл бы только в проде.
      # Хук в build покрывает ещё и локальные сборки, поэтому локальный
      # `firebase deploy --only functions` тоже не сможет задеплоить мусор.
      #
      # Сравнение с out/verify.html через cmp — самая сильная из проверок:
      # она доказывает, что база получена ИМЕННО ИЗ ЭТОЙ сборки, а не
      # осталась от предыдущей. Именно устаревшая копия сломала авто-доставку
      # отчётов 30.09.2026 (job 728cdf6e): функция отдавала снапшот от
      # 7 сентября, часть его ассетов /_next/static/* была 404, гидрация не
      # проходила, маркер #passport-report не появлялся, и ShareService
      # возвращал монеты, не отправив сообщение в Telegram.
      - name: Verify verify_base.html came from this build
        run: |
          if [ ! -f functions/verify_base.html ]; then
            echo "::error::functions/verify_base.html отсутствует — build-хук build:og-base не отработал"
            exit 1
          fi
          if ! cmp -s out/verify.html functions/verify_base.html; then
            echo "::error::verify_base.html не совпадает с out/verify.html — база не из этой сборки"
            exit 1
          fi
          test "$(stat -c%s functions/verify_base.html)" -gt 1000
          grep -q '<meta name="next-size-adjust" content=""/>' functions/verify_base.html
          echo "verify_base.html: $(stat -c%s functions/verify_base.html) bytes, identical to out/verify.html, injection anchor present"

      # Зависимости ставятся не только для облачной сборки: firebase CLI
      # загружает functions/index.js ЛОКАЛЬНО, чтобы прочитать __endpoint и
      # определить region. Без firebase-functions в functions/node_modules
      # деплой упадёт ещё до обращения к GCP.
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund

      # Порядок ОБЯЗАТЕЛЬНО functions -> hosting.
      #
      # Функция деплоится со свежей базой ДО того, как hosting начнёт
      # направлять на неё /verify, поэтому окна со сломанной страницей не
      # возникает. Если этот шаг упадёт (например, не хватит прав на Cloud
      # Functions / Cloud Build / Artifact Registry), job прервётся и hosting
      # не задеплоится вовсе — прод останется на предыдущей рабочей версии.
      # Безопасно по построению, но блокирует последующие деплои web до
      # починки, поэтому откатывать нужно именно этот шаг.
      - name: Deploy functions
        if: steps.firebase_check.outputs.missing == 'false'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --project consumer-behavior-card
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONSUMER_BEHAVIOR_CARD }}

      - name: Deploy to Firebase
        if: steps.firebase_check.outputs.missing == 'false'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project consumer-behavior-card
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONSUMER_BEHAVIOR_CARD }}
